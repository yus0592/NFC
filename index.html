<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一碰就連結！NFC智慧感應技術與創新應用</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #F7F6F2;
      color: #132535;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #F7F6F2;
    }
    ::-webkit-scrollbar-thumb {
      background: #2BA99B;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React Code App -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG Icons
    const Icons = {
      Wifi: () => (
        <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      ),
      Smartphone: () => (
        <svg className="w-6 h-6 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2" strokeWidth="2" />
          <line x1="12" y1="18" x2="12.01" y2="18" strokeWidth="3" strokeLinecap="round" />
        </svg>
      ),
      Compass: () => (
        <svg className="w-6 h-6 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" strokeWidth="2" />
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" strokeWidth="2" />
        </svg>
      ),
      Building: () => (
        <svg className="w-6 h-6 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      ),
      Lightbulb: () => (
        <svg className="w-6 h-6 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
        </svg>
      ),
      Wrench: () => (
        <svg className="w-6 h-6 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z" />
        </svg>
      ),
      ChevronRight: () => (
        <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />
        </svg>
      ),
      ChevronLeft: () => (
        <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />
        </svg>
      ),
      CheckCircle: () => (
        <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      ),
      AlertTriangle: () => (
        <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      ),
      Sparkles: () => (
        <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
        </svg>
      ),
      Layers: () => (
        <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
      ),
      QrCode: () => (
        <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-4v-4m0 4h4m-4-8a3 3 0 100-6 3 3 0 000 6zm-6 8a3 3 0 100-6 3 3 0 000 6zm0-8a3 3 0 100-6 3 3 0 000 6z" />
        </svg>
      )
    };

    const INITIAL_PROGRESS = {
      lab: false,
      explore: false,
      community: false,
      creative: false,
      tools: false,
      completedSteps: [],
      creativeCard: null,
    };

    function App() {
      const [currentUnit, setCurrentUnit] = useState('home');
      const [progress, setProgress] = useState(() => {
        const saved = localStorage.getItem('nfc_learning_progress');
        return saved ? JSON.parse(saved) : INITIAL_PROGRESS;
      });

      useEffect(() => {
        localStorage.setItem('nfc_learning_progress', JSON.stringify(progress));
      }, [progress]);

      const markUnitComplete = (unitKey) => {
        setProgress(prev => ({ ...prev, [unitKey]: true }));
      };

      const resetProgress = () => {
        if (window.confirm("確定要重設所有學習進度嗎？")) {
          setProgress(INITIAL_PROGRESS);
          localStorage.removeItem('nfc_learning_progress');
        }
      };

      const calculateProgressPercent = () => {
        const units = ['lab', 'explore', 'community', 'creative', 'tools'];
        const done = units.filter(u => progress[u]).length;
        return Math.round((done / units.length) * 100);
      };

      return (
        <div className="min-h-screen bg-[#F7F6F2] text-[#132535] font-sans flex flex-col justify-between selection:bg-[#2BA99B] selection:text-white">
          <header className="bg-[#132535] text-white sticky top-0 z-50 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <button 
                onClick={() => setCurrentUnit('home')}
                className="flex items-center space-x-2 text-left focus:outline-none group"
              >
                <div className="w-9 h-9 rounded-full bg-[#2BA99B] flex items-center justify-center text-white font-bold group-hover:scale-105 transition-transform">
                  <span className="animate-pulse">📶</span>
                </div>
                <div>
                  <span className="text-xs text-[#F4C542] block font-medium tracking-wider">DOC 數位培力課程</span>
                  <h1 className="text-base sm:text-lg font-bold leading-none tracking-wide">一碰就連結！NFC 智慧感應</h1>
                </div>
              </button>

              <div className="flex items-center space-x-3">
                <div className="hidden md:flex items-center space-x-2 bg-white/10 px-3 py-1.5 rounded-full text-xs">
                  <span>整體進度:</span>
                  <div className="w-20 bg-gray-700 h-2 rounded-full overflow-hidden">
                    <div className="bg-[#F4C542] h-full transition-all duration-300" style={{ width: `${calculateProgressPercent()}%` }}></div>
                  </div>
                  <span className="font-bold text-[#F4C542]">{calculateProgressPercent()}%</span>
                </div>

                {currentUnit !== 'home' && (
                  <button
                    onClick={() => setCurrentUnit('home')}
                    className="px-3 py-1.5 text-xs sm:text-sm bg-[#2BA99B] hover:bg-[#23887d] text-white font-medium rounded-lg transition-colors flex items-center space-x-1"
                  >
                    <span>返回首頁</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {currentUnit === 'home' && <HomePage setCurrentUnit={setCurrentUnit} progress={progress} resetProgress={resetProgress} calculateProgressPercent={calculateProgressPercent} />}
            {currentUnit === 'unit1' && <Unit1Lab markComplete={() => markUnitComplete('lab')} setCurrentUnit={setCurrentUnit} />}
            {currentUnit === 'unit2' && <Unit2Explore markComplete={() => markUnitComplete('explore')} setCurrentUnit={setCurrentUnit} />}
            {currentUnit === 'unit3' && <Unit3Community markComplete={() => markUnitComplete('community')} setCurrentUnit={setCurrentUnit} />}
            {currentUnit === 'unit4' && <Unit4Creative markComplete={() => markUnitComplete('creative')} setCurrentUnit={setCurrentUnit} progress={progress} setProgress={setProgress} />}
            {currentUnit === 'unit5' && <Unit5Tools markComplete={() => markUnitComplete('tools')} setCurrentUnit={setCurrentUnit} progress={progress} setProgress={setProgress} />}
          </main>

          <footer className="bg-[#132535] text-white border-t border-gray-800 py-6 text-center text-xs text-gray-400">
            <div className="max-w-7xl mx-auto px-4">
              <p className="mb-2 font-medium">南投縣名間鄉新民數位機會中心（新民DOC）數位教材</p>
              <p>© 2026 一碰就連結！NFC 智慧感應技術與創新應用版權所有</p>
            </div>
          </footer>
        </div>
      );
    }

    function UnitNavigation({ current, prev, next, setCurrentUnit, onComplete }) {
      return (
        <div className="mt-12 pt-6 border-t border-[#D9D9D9] flex flex-col sm:flex-row items-center justify-between gap-4">
          <div className="flex space-x-3 w-full sm:w-auto justify-between">
            {prev ? (
              <button 
                onClick={() => { onComplete && onComplete(); setCurrentUnit(prev.id); }}
                className="flex items-center space-x-1 px-4 py-2 bg-gray-200 hover:bg-gray-300 text-[#132535] rounded-lg font-medium text-sm transition-colors"
              >
                <Icons.ChevronLeft />
                <span>上一單元：{prev.title}</span>
              </button>
            ) : <div />}
          </div>

          <div className="flex space-x-3 w-full sm:w-auto justify-end">
            {next && (
              <button 
                onClick={() => { onComplete && onComplete(); setCurrentUnit(next.id); }}
                className="flex items-center space-x-1 px-5 py-2.5 bg-[#2BA99B] hover:bg-[#21877c] text-white rounded-lg font-medium text-sm shadow-md hover:shadow-lg transition-all"
              >
                <span>完成本章，前往：{next.title}</span>
                <Icons.ChevronRight />
              </button>
            )}
          </div>
        </div>
      );
    }

    function InstructorTip({ guide, tryIt }) {
      return (
        <div className="mb-8 bg-amber-50 border-l-4 border-[#F4C542] p-4 rounded-r-lg shadow-sm">
          <div className="flex items-center justify-between mb-2">
            <span className="inline-flex items-center space-x-1 text-xs font-bold bg-[#F4C542] text-[#132535] px-2 py-0.5 rounded">
              📖 線上課程導引
            </span>
          </div>
          <div className="grid md:grid-cols-2 gap-3 text-sm text-[#132535] mt-1">
            <div>
              <strong className="text-[#2BA99B] block mb-0.5">💬 講師引導思考：</strong>
              <p className="text-gray-700">{guide}</p>
            </div>
            <div>
              <strong className="text-[#2BA99B] block mb-0.5">👉 自己試試看：</strong>
              <p className="text-gray-700">{tryIt}</p>
            </div>
          </div>
        </div>
      );
    }

    function HomePage({ setCurrentUnit, progress, resetProgress, calculateProgressPercent }) {
      const units = [
        { id: 'unit1', title: '單元一：NFC 感應實驗室', desc: '手動拖曳體驗近距離感應，圖解電磁感應原理與 QR Code 差異。', icon: Icons.Smartphone, key: 'lab' },
        { id: 'unit2', title: '單元二：NFC 生活應用探索館', desc: '開鎖、支付、智慧平安符與導覽，探索生活中的 6 大感應場景。', icon: Icons.Compass, key: 'explore' },
        { id: 'unit3', title: '單元三：NFC × DOC 智慧社區', desc: '進入虛擬臺灣社區地圖，體驗活動報名、地方導覽與故事牆。', icon: Icons.Building, key: 'community' },
        { id: 'unit4', title: '單元四：NFC 創意設計室', desc: '選擇情境與需求，一步步產出屬於你的「智慧創意方案卡」。', icon: Icons.Lightbulb, key: 'creative' },
        { id: 'unit5', title: '單元五：NFC Tools 實作教學站', desc: '圖解 APP 寫入步驟、互動畫面模擬器與常見錯誤快查指南。', icon: Icons.Wrench, key: 'tools' },
      ];

      return (
        <div className="space-y-10">
          <div className="bg-gradient-to-br from-[#132535] via-[#1a3348] to-[#132535] text-white rounded-2xl p-6 sm:p-10 shadow-xl relative overflow-hidden">
            <div className="relative z-10 max-w-3xl">
              <span className="inline-block bg-[#2BA99B] text-white text-xs px-3 py-1 rounded-full font-bold tracking-widest uppercase mb-3">
                新民 DOC 數位培力線上教材
              </span>
              <h1 className="text-3xl sm:text-4xl lg:text-5xl font-black mb-4 tracking-tight leading-tight">
                一碰就連結！<br />
                <span className="text-[#F4C542]">NFC 智慧感應技術</span>與創新應用
              </h1>
              <p className="text-gray-200 text-base sm:text-lg mb-8 leading-relaxed">
                從生活中的感應科技出發，探索 NFC 的各種應用，親手製作智慧感應作品，讓科技與社區生活產生更多連結。無需程式基礎，即點即學！
              </p>

              <div className="flex flex-wrap gap-4 items-center">
                <button 
                  onClick={() => setCurrentUnit('unit1')}
                  className="px-8 py-3.5 bg-[#F4C542] hover:bg-[#e0b232] text-[#132535] font-black rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all text-lg flex items-center space-x-2"
                >
                  <span>開始探索課程</span>
                  <Icons.ChevronRight />
                </button>

                {calculateProgressPercent() > 0 && (
                  <button 
                    onClick={() => {
                      const firstUnfinished = units.find(u => !progress[u.key]) || units[0];
                      setCurrentUnit(firstUnfinished.id);
                    }}
                    className="px-6 py-3.5 bg-white/10 hover:bg-white/20 text-white font-semibold rounded-xl border border-white/20 transition-all text-base flex items-center space-x-2"
                  >
                    <span>繼續上次進度 ({calculateProgressPercent()}%)</span>
                  </button>
                )}
              </div>
            </div>
          </div>

          <div>
            <div className="flex items-center justify-between mb-6">
              <div>
                <h2 className="text-2xl font-bold text-[#132535]">互動學習單元</h2>
                <p className="text-sm text-gray-600">可以自由選擇任一單元開始，完全不受順序限制</p>
              </div>
              <button 
                onClick={resetProgress}
                className="text-xs text-gray-500 hover:text-red-600 underline"
              >
                重置進度
              </button>
            </div>

            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
              {units.map((unit, idx) => {
                const Icon = unit.icon;
                const isDone = progress[unit.key];
                return (
                  <div 
                    key={unit.id}
                    onClick={() => setCurrentUnit(unit.id)}
                    className={`bg-white rounded-xl p-6 border-2 transition-all cursor-pointer group flex flex-col justify-between hover:shadow-lg relative overflow-hidden ${
                      isDone ? 'border-[#2BA99B]' : 'border-gray-200 hover:border-[#2BA99B]'
                    }`}
                  >
                    {isDone && (
                      <div className="absolute top-0 right-0 bg-[#2BA99B] text-white px-3 py-1 rounded-bl-xl text-xs font-bold flex items-center space-x-1">
                        <Icons.CheckCircle />
                        <span>已完成</span>
                      </div>
                    )}
                    <div>
                      <div className="flex items-center space-x-3 mb-4">
                        <div className={`w-12 h-12 rounded-xl flex items-center justify-center transition-colors ${
                          isDone ? 'bg-[#2BA99B] text-white' : 'bg-[#F7F6F2] text-[#132535] group-hover:bg-[#2BA99B] group-hover:text-white'
                        }`}>
                          <Icon />
                        </div>
                        <div>
                          <span className="text-xs text-gray-400 font-mono block">UNIT 0{idx + 1}</span>
                          <h3 className="text-lg font-bold text-[#132535] group-hover:text-[#2BA99B] transition-colors">
                            {unit.title.split('：')[1]}
                          </h3>
                        </div>
                      </div>
                      <p className="text-sm text-gray-600 mb-6 line-clamp-2">{unit.desc}</p>
                    </div>

                    <div className="pt-4 border-t border-gray-100 flex items-center justify-between text-sm font-semibold text-[#2BA99B]">
                      <span>點擊進入體驗</span>
                      <Icons.ChevronRight />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // Unit 1
    function Unit1Lab({ markComplete, setCurrentUnit }) {
      const [distance, setDistance] = useState(10);
      const [activeStep, setActiveStep] = useState(1);
      const [quizAnswer, setQuizAnswer] = useState(null);

      const isSensing = distance <= 2;

      useEffect(() => {
        if (isSensing) markComplete();
      }, [isSensing]);

      return (
        <div className="space-y-8">
          <div className="border-b border-[#D9D9D9] pb-4">
            <span className="text-xs font-bold text-[#2BA99B] tracking-wider uppercase">UNIT 01</span>
            <h2 className="text-3xl font-black text-[#132535]">NFC 感應實驗室</h2>
            <p className="text-gray-600 text-sm mt-1">理解 NFC（近場通訊）的物理原理與感應距離極限</p>
          </div>

          <InstructorTip 
            guide="為什麼悠遊卡或手機感應時必須靠得這麼近？靠太遠會發生什麼事？"
            tryIt="拉動下方的滑桿，將手機慢慢靠近 NFC 標籤，觀察感應成功的距離範圍！"
          />

          {/* SIMULATOR */}
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-[#D9D9D9]">
            <h3 className="text-xl font-bold text-[#132535] mb-2 flex items-center space-x-2">
              <Icons.Smartphone />
              <span>功能一：手機感應距離模擬器</span>
            </h3>
            <p className="text-xs text-gray-500 mb-6">透過調整滑桿來測試感應距離（真正的 NFC 感應距離約在 0 ~ 2 公分內）</p>

            <div className="bg-[#132535] rounded-xl p-8 text-white min-h-[300px] flex flex-col items-center justify-center relative overflow-hidden">
              <div className="absolute top-4 left-4 bg-white/10 px-3 py-1 rounded-full text-xs font-mono">
                當前距離: <span className="text-[#F4C542] font-bold text-sm">{distance} cm</span>
              </div>

              <div className="w-full max-w-md flex items-center justify-between relative my-8">
                <div 
                  className="flex flex-col items-center transition-all duration-300 z-10"
                  style={{ transform: `translateX(${(10 - distance) * 12}px)` }}
                >
                  <div className={`w-24 h-44 bg-gray-800 border-4 rounded-2xl flex flex-col items-center justify-between p-2 shadow-2xl relative ${isSensing ? 'border-[#F4C542] ring-4 ring-[#F4C542]/40' : 'border-gray-600'}`}>
                    <div className="w-8 h-1.5 bg-gray-700 rounded-full mb-1"></div>
                    <div className="flex-1 w-full bg-gray-900 rounded-lg flex flex-col items-center justify-center p-2 text-center">
                      {isSensing ? (
                        <div className="animate-fade-in text-xs text-[#F4C542]">
                          <Icons.CheckCircle />
                          <p className="font-bold">感應成功！</p>
                          <p className="text-[10px] text-gray-300 mt-1">開啟 DOC 官網...</p>
                        </div>
                      ) : (
                        <p className="text-[10px] text-gray-500">靠近標籤<br />開始感應</p>
                      )}
                    </div>
                  </div>
                  <span className="text-xs text-gray-300 mt-2 font-semibold">智慧型手機</span>
                </div>

                <div className="flex flex-col items-center z-10">

                  <option value="video">社區耆老故事影片</option>
                  <option value="map">社區私房景點地圖</option>
                  <option value="wifi">一鍵連接社區免費 Wi-Fi</option>
                </select>
              </div>
            </div>
            <div className="mt-4 p-3 bg-white rounded-lg border border-amber-200 text-xs text-[#132535]">
              🎯 <strong>你的專屬構想：</strong> 我要在 <span className="text-[#2BA99B] font-bold">{spots.find(s=>s.id===userChoice.spot)?.name}</span> 設置 NFC 貼紙，讓大家碰一下手機就能獲得 <span className="text-[#2BA99B] font-bold">{userChoice.action === 'form' ? '線上報名表' : userChoice.action === 'video' ? '耆老故事影片' : userChoice.action === 'map' ? '私房景點地圖' : '免費 Wi-Fi'}</span>！
            </div>
          </div>

          <UnitNavigation 
            current="unit3" 
            prev={{ id: 'unit2', title: 'NFC 生活應用探索館' }}
            next={{ id: 'unit4', title: 'NFC 創意設計室' }} 
            setCurrentUnit={setCurrentUnit}
            onComplete={markComplete}
          />
        </div>
      );
    }

    // Unit 4
    function Unit4Creative({ markComplete, setCurrentUnit, progress, setProgress }) {
      const [formData, setFormData] = useState({
        target: '社區長輩',
        problem: '活動報名紙本表單容易遺失且字太小',
        type: '開啟 Google 報名表單',
        location: '貼在社區香火袋或活動卡上',
        title: '長輩智慧健康關懷卡'
      });

      const targets = ['社區長輩', '觀光遊客', 'DOC 課程學員', '在地農特產品買家'];
      const problems = [
        '活動報名紙本表單容易遺失且字太小',
        '景點缺乏即時語音導覽解說',
        '農產品缺少產地履歷與信任感',
        '長輩緊急聯絡資訊不易隨身攜帶'
      ];
      const types = ['開啟網址 (Website URL)', '播放 YouTube 影片', '顯示電話號碼 / 緊急聯絡', '自動連線 Wi-Fi 網路'];
      const locations = ['貼在平安符 / 香火袋內', '貼在名片 / 識別證', '貼在導覽告示牌', '貼在特產禮盒外包裝'];

      const handleSaveCard = () => {
        setProgress(prev => ({
          ...prev,
          creativeCard: formData,
          creative: true
        }));
        markComplete();
        alert("🎉 恭喜！你的創意方案卡已成功儲存！");
      };

      return (
        <div className="space-y-8">
          <div className="border-b border-[#D9D9D9] pb-4">
            <span className="text-xs font-bold text-[#2BA99B] tracking-wider uppercase">UNIT 04</span>
            <h2 className="text-3xl font-black text-[#132535]">NFC 創意設計室</h2>
            <p className="text-gray-600 text-sm mt-1">動動腦！選擇服務對象與痛點，設計屬於你的智慧社區方案</p>
          </div>

          <InstructorTip 
            guide="發揮你的創意！想像一下在你的生活或社區中，有什麼問題可以透過『嗶一下』來解決？"
            tryIt="跟著 5 個步驟選擇，最後產出一張專屬的『我的 NFC 創意方案卡』！"
          />

          <div className="grid lg:grid-cols-2 gap-8">
            <div className="bg-white rounded-2xl p-6 border border-[#D9D9D9] shadow-sm space-y-5">
              <h3 className="text-xl font-bold text-[#132535] mb-2 flex items-center space-x-2">
                <Icons.Lightbulb />
                <span>NFC 創意方案產生器</span>
              </h3>

              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">第一步：選擇服務對象</label>
                <div className="grid grid-cols-2 gap-2">
                  {targets.map(t => (
                    <button
                      key={t}
                      onClick={() => setFormData({ ...formData, target: t })}
                      className={`p-2.5 rounded-lg text-xs font-semibold border transition-all text-left ${
                        formData.target === t 
                          ? 'bg-[#2BA99B] text-white border-[#2BA99B]' 
                          : 'bg-[#F7F6F2] text-[#132535] border-gray-200 hover:border-gray-300'
                      }`}
                    >
                      {t}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">第二步：選擇想解決的問題</label>
                <select
                  value={formData.problem}
                  onChange={(e) => setFormData({ ...formData, problem: e.target.value })}
                  className="w-full p-2.5 rounded-lg border border-gray-300 text-xs text-[#132535] bg-white"
                >
                  {problems.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">第三步：選擇 NFC 應用方式</label>
                <select
                  value={formData.type}
                  onChange={(e) => setFormData({ ...formData, type: e.target.value })}
                  className="w-full p-2.5 rounded-lg border border-gray-300 text-xs text-[#132535] bg-white"
                >
                  {types.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">第四步：選擇設置位置</label>
                <select
                  value={formData.location}
                  onChange={(e) => setFormData({ ...formData, location: e.target.value })}
                  className="w-full p-2.5 rounded-lg border border-gray-300 text-xs text-[#132535] bg-white"
                >
                  {locations.map(l => <option key={l} value={l}>{l}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">第五步：為你的作品命名</label>
                <input 
                  type="text"
                  value={formData.title}
                  onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                  className="w-full p-2.5 rounded-lg border border-gray-300 text-sm font-bold text-[#132535] focus:ring-2 focus:ring-[#2BA99B] focus:outline-none"
                  placeholder="例如：長輩智慧平安符"
                />
              </div>

              <button
                onClick={handleSaveCard}
                className="w-full py-3 bg-[#F4C542] hover:bg-[#e0b232] text-[#132535] font-black rounded-xl shadow transition-all flex items-center justify-center space-x-2"
              >
                <Icons.Sparkles />
                <span>儲存我的創意方案卡</span>
              </button>
            </div>

            <div className="flex flex-col justify-center">
              <div className="bg-[#132535] text-white p-6 rounded-2xl border-4 border-[#F4C542] shadow-2xl relative overflow-hidden space-y-4">
                <div className="flex justify-between items-start border-b border-white/20 pb-3">
                  <div>
                    <span className="text-[10px] bg-[#2BA99B] text-white px-2 py-0.5 rounded font-bold uppercase">DOC 智慧創新作品</span>
                    <h4 className="text-xl font-black text-[#F4C542] mt-1">{formData.title || '（作品名稱）'}</h4>
                  </div>
                  <span className="text-2xl animate-pulse">📶</span>
                </div>

                <div className="space-y-2 text-xs text-gray-200">
                  <p>👤 <strong>服務對象：</strong><span className="text-white font-semibold">{formData.target}</span></p>
                  <p>❓ <strong>為了解決：</strong><span className="text-white font-semibold">{formData.problem}</span></p>
                  <p>⚡ <strong>感應方式：</strong><span className="text-[#F4C542] font-semibold">{formData.type}</span></p>
                  <p>📍 <strong>感應位置：</strong><span className="text-white font-semibold">{formData.location}</span></p>
                </div>

                <div className="pt-3 border-t border-white/10 flex justify-between items-center text-[10px] text-gray-400">
                  <span>設計者：DOC 學員</span>
                  <span>狀態：已成功產出方案</span>
                </div>
              </div>
            </div>
          </div>

          <UnitNavigation 
            current="unit4" 
            prev={{ id: 'unit3', title: 'NFC × DOC 智慧社區' }}
            next={{ id: 'unit5', title: 'NFC Tools 實作教學站' }} 
            setCurrentUnit={setCurrentUnit}
            onComplete={markComplete}
          />
        </div>
      );
    }

    // Unit 5
    function Unit5Tools({ markComplete, setCurrentUnit, progress, setProgress }) {
      const [activeTab, setActiveTab] = useState('steps');
      const [currentStep, setCurrentStep] = useState(0);
      const [simState, setSimState] = useState({ menu: 'main', records: [], isWriting: false, success: false });

      const steps = [
        { num: 1, title: '確認手機 NFC 開啟', desc: 'Android 使用者請至「設定 > 連線 > NFC」開啟；iPhone (7以上) 預設已開啟。', warning: '注意：部分舊型 Android 手機預設未開啟 NFC。' },
        { num: 2, title: '開啟 NFC Tools APP', desc: '在手機開啟已下載好的 NFC Tools 應用程式。', warning: '若有彈出權限請求，請選擇允許。' },
        { num: 3, title: '選擇「寫入 (Write)」', desc: '在 APP 主選單點擊第一個大按鈕【 Write 】(寫入)。', warning: '注意不是點選 Read (讀取) 喔！' },
        { num: 4, title: '新增記錄 (Add a record)', desc: '點擊【 Add a record 】，接著選擇【 URL / URI 】選項。', warning: '這樣才能讓手機感應後自動打開網頁。' },
        { num: 5, title: '輸入要寫入的網址', desc: '輸入您的網址（例如 DOC 官方網站：https://itaiwan.moe.gov.tw ），並點擊 OK。', warning: '請確保開頭包含 https:// 。' },
        { num: 6, title: '點擊 Write (寫入) 並靠卡', desc: '點擊頁面最下方的【 Write /XX Bytes 】，將 NFC 貼紙貼近手機背面感應區。', warning: '請保持貼紙緊貼手機 1~2 秒不要拿開。' },
        { num: 7, title: '出現綠色勾勾，完成！', desc: '畫面上跳出「Write complete!」與綠色勾勾，代表寫入成功！', warning: '現在可以用手機靠近貼紙測試看看囉！' }
      ];

      const handleToggleStepComplete = (idx) => {
        const list = progress.completedSteps || [];
        const newList = list.includes(idx) ? list.filter(i => i !== idx) : [...list, idx];
        setProgress({ ...progress, completedSteps: newList });
        if (newList.length === steps.length) markComplete();
      };

      return (
        <div className="space-y-8">
          <div className="border-b border-[#D9D9D9] pb-4">
            <span className="text-xs font-bold text-[#2BA99B] tracking-wider uppercase">UNIT 05</span>
            <h2 className="text-3xl font-black text-[#132535]">NFC Tools 實作教學站</h2>
            <p className="text-gray-600 text-sm mt-1">手把手圖解寫入教學、APP 操作模擬器與常見障礙排除</p>
          </div>

          <InstructorTip 
            guide="這單元是實作關鍵！請拿出您的實體手機與 NFC 貼紙，跟著步驟操作。"
            tryIt="如果不確定怎麼操作，可以先在『APP 操作模擬器』中演練一遍再拿出實體手機！"
          />

          <div className="flex border-b border-gray-200 space-x-4">
            <button
              onClick={() => setActiveTab('steps')}
              className={`pb-3 text-sm font-bold border-b-2 transition-all ${
                activeTab === 'steps' ? 'border-[#2BA99B] text-[#2BA99B]' : 'border-transparent text-gray-500 hover:text-gray-700'
              }`}
            >
              📖 7 大圖解寫入步驟
            </button>
            <button
              onClick={() => setActiveTab('simulator')}
              className={`pb-3 text-sm font-bold border-b-2 transition-all ${
                activeTab === 'simulator' ? 'border-[#2BA99B] text-[#2BA99B]' : 'border-transparent text-gray-500 hover:text-gray-700'
              }`}
            >
              📱 APP 介面演練模擬器
            </button>
            <button
              onClick={() => setActiveTab('faq')}
              className={`pb-3 text-sm font-bold border-b-2 transition-all ${
                activeTab === 'faq' ? 'border-[#2BA99B] text-[#2BA99B]' : 'border-transparent text-gray-500 hover:text-gray-700'
              }`}
            >
              ❓ 常見故障排除 (FAQ)
            </button>
          </div>

          {/* TAB 1: STEPS */}
          {activeTab === 'steps' && (
            <div className="space-y-6">
              <div className="bg-white rounded-2xl p-6 border border-[#D9D9D9] shadow-sm">
                <div className="flex items-center justify-between mb-4">
                  <span className="text-xs font-bold text-[#2BA99B] bg-[#2BA99B]/10 px-3 py-1 rounded-full">
                    步驟 {currentStep + 1} / {steps.length}
                  </span>
                  <div className="flex space-x-2">
                    <button
                      disabled={currentStep === 0}
                      onClick={() => setCurrentStep(prev => prev - 1)}
                      className="px-3 py-1.5 bg-gray-100 disabled:opacity-40 text-[#132535] rounded-lg text-xs font-bold"
                    >
                      上一步
                    </button>
                    <button
                      disabled={currentStep === steps.length - 1}
                      onClick={() => setCurrentStep(prev => prev + 1)}
                      className="px-3 py-1.5 bg-[#2BA99B] text-white disabled:opacity-40 rounded-lg text-xs font-bold"
                    >
                      下一步
                    </button>
                  </div>
                </div>

                <div className="bg-[#F7F6F2] p-6 rounded-xl border border-gray-200 space-y-4">
                  <h3 className="text-xl font-bold text-[#132535]">
                    Step {steps[currentStep].num}. {steps[currentStep].title}
                  </h3>
                  <p className="text-sm text-gray-700">{steps[currentStep].desc}</p>
                  
                  <div className="p-3 bg-amber-50 rounded-lg border border-[#F4C542] text-xs text-amber-900 flex items-center space-x-2">
                    <Icons.AlertTriangle />
                    <span><strong>溫馨提示：</strong>{steps[currentStep].warning}</span>
                  </div>

                  <div className="pt-2 flex items-center justify-between">
                    <button
                      onClick={() => handleToggleStepComplete(currentStep)}
                      className={`flex items-center space-x-2 px-4 py-2 rounded-lg text-xs font-bold transition-all ${
                        (progress.completedSteps || []).includes(currentStep)
                          ? 'bg-[#2BA99B] text-white'
                          : 'bg-white text-gray-600 border border-gray-300'
                      }`}
                    >
                      <span>{(progress.completedSteps || []).includes(currentStep) ? '✓ 此步驟已完成' : '標示為已完成'}</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: SIMULATOR */}
          {activeTab === 'simulator' && (
            <div className="bg-white rounded-2xl p-6 border border-[#D9D9D9] shadow-sm">
              <h3 className="text-lg font-bold text-[#132535] mb-2">NFC Tools 介面網頁模擬器</h3>
              <p className="text-xs text-gray-500 mb-6">此模擬介面僅供熟悉點擊流程，非真實寫入硬體。</p>

              <div className="max-w-sm mx-auto bg-gray-900 border-8 border-gray-800 rounded-3xl p-4 text-white shadow-2xl min-h-[420px] flex flex-col justify-between">
                <div className="border-b border-gray-800 pb-2 text-center">
                  <span className="text-xs font-mono text-[#2BA99B]">NFC Tools Sim</span>
                </div>

                <div className="my-auto space-y-3">
                  {simState.menu === 'main' && (
                    <div className="space-y-3">
                      <button 
                        onClick={() => setSimState({ ...simState, menu: 'write' })}
                        className="w-full py-3 bg-[#2BA99B] text-white font-bold rounded-xl text-sm shadow hover:bg-[#228378]"
                      >
                        ✍️ Write (寫入)
                      </button>
                      <button className="w-full py-3 bg-gray-800 text-gray-400 font-bold rounded-xl text-sm cursor-not-allowed">
                        🔍 Read (讀取 - 練習免點)
                      </button>
                    </div>
                  )}

                  {simState.menu === 'write' && (
                    <div className="space-y-3">
                      <button 
                        onClick={() => setSimState({ ...simState, menu: 'add' })}
                        className="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-white font-semibold rounded-lg text-xs"
                      >
                        ➕ Add a record (新增記錄)
                      </button>

                      {simState.records.length > 0 && (
                        <div className="p-2 bg-gray-800 rounded text-xs text-green-400 font-mono">
                          {simState.records[0]}
                        </div>
                      )}

                      {simState.records.length > 0 && !simState.isWriting && (
                        <button 
                          onClick={() => setSimState({ ...simState, isWriting: true })}
                          className="w-full py-3 bg-[#F4C542] text-[#132535] font-black rounded-xl text-sm animate-bounce"
                        >
                          📲 Write / 28 Bytes (靠近貼紙感應)
                        </button>
                      )}

                      {simState.isWriting && (
                        <div className="p-4 bg-amber-900/50 rounded-xl text-center space-y-2 border border-[#F4C542]">
                          <span className="text-2xl animate-ping block">📶</span>
                          <p className="text-xs text-white">請將 NFC 貼紙靠近手機背面...</p>
                          <button 
                            onClick={() => setSimState({ ...simState, isWriting: false, success: true, menu: 'success' })}
                            className="px-3 py-1 bg-[#2BA99B] text-white text-xs rounded"
                          >
                            （模擬靠近靠卡成功）
                          </button>
                        </div>
                      )}
                    </div>
                  )}

                  {simState.menu === 'add' && (
                    <div className="space-y-3">
                      <p className="text-xs text-gray-400">選擇要寫入的類型：</p>
                      <button 
                        onClick={() => setSimState({ ...simState, menu: 'write', records: ['URL: https://itaiwan.moe.gov.tw'] })}
                        className="w-full py-2 bg-gray-800 text-[#F4C542] text-xs rounded font-bold text-left px-3"
                      >
                        🔗 URL / URI (網址)
                      </button>
                    </div>
                  )}

                  {simState.menu === 'success' && (
                    <div className="text-center space-y-3">
                      <Icons.CheckCircle />
                      <h4 className="font-bold text-base text-white">Write complete!</h4>
                      <p className="text-xs text-gray-400">成功完成網頁模擬寫入！</p>
                      <button 
                        onClick={() => setSimState({ menu: 'main', records: [], isWriting: false, success: false })}
                        className="px-4 py-1.5 bg-gray-800 text-xs text-white rounded-lg"
                      >
                        重試模擬
                      </button>
                    </div>
                  )}
                </div>

                <div className="text-[10px] text-gray-600 text-center">
                  NFC Tools Educational Mockup
                </div>
              </div>
            </div>
          )}

          {/* TAB 3: FAQ */}
          {activeTab === 'faq' && (
            <div className="bg-white rounded-2xl p-6 border border-[#D9D9D9] shadow-sm space-y-4">
              <h3 className="text-lg font-bold text-[#132535] mb-2">常見故障問題快查與排除</h3>
              
              <div className="space-y-3 text-sm">
                <details className="p-3 bg-[#F7F6F2] rounded-lg border border-gray-200">
                  <summary className="font-bold text-[#132535] cursor-pointer">❓ 手機靠近貼紙完全沒有反應怎麼辦？</summary>
                  <p className="mt-2 text-xs text-gray-600 leading-relaxed">
                    1. 請確認手機是否裝了太厚的金屬保護殼（請先卸下殼）。<br />
                    2. Android 手機請確認下拉選單中的「NFC」按鈕是否已點亮開啟。<br />
                    3. iPhone 感應位置在手機「頂端鏡頭旁」，Android 則多在「背蓋正中央」。
                  </p>
                </details>

                <details className="p-3 bg-[#F7F6F2] rounded-lg border border-gray-200">
                  <summary className="font-bold text-[#132535] cursor-pointer">❓ APP 顯示「Tag is locked」無法寫入？</summary>
                  <p className="mt-2 text-xs text-gray-600 leading-relaxed">
                    代表該貼紙先前已被設定為「唯讀 (Lock)」。請換一張新的 NTAG213 貼紙再試一次。寫入時切勿勾選 Lock 功能！
                  </p>
                </details>

                <details className="p-3 bg-[#F7F6F2] rounded-lg border border-gray-200">
                  <summary className="font-bold text-[#132535] cursor-pointer">❓ 感應後網頁開不出來？</summary>
                  <p className="mt-2 text-xs text-gray-600 leading-relaxed">
                    請檢查輸入網址時是否漏掉了「https://」。若只輸入 www.xxx.com 手機可能無法辨識為網址。
                  </p>
                </details>
              </div>
            </div>
          )}

          <UnitNavigation 
            current="unit5" 
            prev={{ id: 'unit4', title: 'NFC 創意設計室' }}
            setCurrentUnit={setCurrentUnit}
            onComplete={markComplete}
          />
        </div>
      );
    }

    // Render React to Root
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
